  # Frontend service
  frontend:
    build:
      context: ./fronted
      dockerfile: Dockerfile
    container_name: fitness-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fitness-network
    restart: unless-stopped
    healthcheck:
